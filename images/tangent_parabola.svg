<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Tangent to a parabola</title>
  <desc>Static diagram showing the tangent line to y = x² at the point (1, 1), with slope 2.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="clip">
      <rect x="60" y="20" width="560" height="410"/>
    </clipPath>
  </defs>

  <!-- Grid -->
  <g stroke="#888" stroke-width="0.4" opacity="0.15">
    <line x1="140" y1="20" x2="140" y2="430"/>
    <line x1="240" y1="20" x2="240" y2="430"/>
    <line x1="440" y1="20" x2="440" y2="430"/>
    <line x1="540" y1="20" x2="540" y2="430"/>
    <line x1="60"  y1="330" x2="620" y2="330"/>
    <line x1="60"  y1="230" x2="620" y2="230"/>
    <line x1="60"  y1="130" x2="620" y2="130"/>
  </g>

  <!-- X axis -->
  <line x1="60" y1="430" x2="618" y2="430"
        stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Y axis -->
  <line x1="340" y1="440" x2="340" y2="22"
        stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="626" y="434" font-size="13" fill="#666" font-family="sans-serif">x</text>
  <text x="348" y="20"  font-size="13" fill="#666" font-family="sans-serif">y</text>
  <text x="334" y="446" font-size="11" fill="#999" font-family="sans-serif" text-anchor="middle">0</text>

  <!-- Tick marks and numbers: x axis -->
  <g font-size="11" fill="#999" font-family="sans-serif" text-anchor="middle">
    <text x="240" y="446">-1</text>
    <text x="440" y="446">1</text>
    <text x="140" y="446">-2</text>
    <text x="540" y="446">2</text>
  </g>
  <!-- Tick marks and numbers: y axis -->
  <g font-size="11" fill="#999" font-family="sans-serif" text-anchor="end">
    <text x="332" y="334">1</text>
    <text x="332" y="234">2</text>
    <text x="332" y="134">3</text>
  </g>

  <!-- Parabola y = x², scale 100px/unit, origin at (340, 430) -->
  <!-- Precomputed polyline points for x from -2.5 to 2.5 -->
  <polyline fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round"
            clip-path="url(#clip)"
            points="
              90,1055 100,1005 110,957 120,910 130,866 140,823
              150,782 160,743 170,706 180,671 190,638 200,607
              210,578 220,550 230,525 240,501 250,479 260,459
              270,441 280,424 290,410 300,397 310,386 320,377
              330,369 340,363 350,358 360,356 370,355 380,356
              390,359 400,363 410,370 420,378 430,388 440,400
              450,413 460,429 470,446 480,465 490,486 500,508
              510,533 520,559 530,587 540,616 550,648 560,681
              570,716 580,752 590,791 600,831
            "/>

  <!-- Tangent at x=1: slope=2, passes through (1,1)
       y = 2x - 1
       At x=-0.5 (svg x=290): y=2(-0.5)-1=-2 → svg_y=430-(-2*100)=630 (clipped)
       At x=2.4 (svg x=580): y=2(2.4)-1=3.8 → svg_y=430-380=50
       Use x=-0.5..2.4 so line is visible in frame -->
  <line x1="190" y1="630" x2="582" y2="46"
        stroke="#EF9F27" stroke-width="1.8"
        stroke-linecap="round" clip-path="url(#clip)"/>

  <!-- Point of tangency at (1, 1): svg (440, 330) -->
  <circle cx="440" cy="330" r="6" fill="#EF9F27" stroke="white" stroke-width="2"/>

  <!-- Right-angle indicator at point of tangency (small square) -->
  <!-- Not shown for tangent — just the point -->

  <!-- Labels -->
  <!-- Parabola label -->
  <text x="188" y="118" font-size="14" font-weight="500"
        fill="#0F6E56" font-family="sans-serif">y = x²</text>

  <!-- Tangent label -->
  <text x="510" y="100" font-size="13" fill="#BA7517" font-family="sans-serif">tangent at x = 1</text>
  <text x="510" y="117" font-size="12" fill="#BA7517" font-family="sans-serif">y = 2x − 1, slope = 2</text>

  <!-- Point label -->
  <text x="450" y="322" font-size="12" fill="#BA7517" font-family="sans-serif">(1, 1)</text>

  <!-- Slope annotation: small dashed rise/run triangle -->
  <line x1="440" y1="330" x2="540" y2="330"
        stroke="#BA7517" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="540" y1="330" x2="540" y2="130"
        stroke="#BA7517" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="487" y="346" font-size="11" fill="#BA7517" font-family="sans-serif" text-anchor="middle">run = 1</text>
  <text x="556" y="235" font-size="11" fill="#BA7517" font-family="sans-serif">rise = 2</text>

</svg>